
<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fanarts | Verade PT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="fanarts-section" id="fanarts">

    <h2>🎨 Fanarts de Mundo Torajo 🍏</h2>

    <p>
        Um cantinho dedicado à criatividade dos membros
        da comunidade Verade PT!
    </p>

    <div class="fanarts-carrossel">

        <div class="fanart-slide">
            <img id="fanartImagem"
                 src="imagens/desenhos/Fanart1.jpeg"
                 alt="Fanart de Mundo Torajo">

            <h3 id="fanartArtista">
                Bea ฅ⁠^⁠•⁠ﻌ⁠•⁠^⁠ฅ
            </h3>

            <p id="fanartPersonagem">
                Personagem: Azedo (versão mulher)
            </p>
        </div>

        <div class="fanart-controles">

            <button onclick="anteriorFanart()">❮</button>

            <span id="fanartContador">1 / 1</span>

            <button onclick="proximaFanart()">❯</button>

        </div>

        <button id="pausarFanarts" onclick="pausarFanarts()">
            ⏸️ Pausar
        </button>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
