
<section class="fanarts-section" id="fanarts">

    <h2>🎨 Fanarts de Mundo Torajo 🍏</h2>

    <p>
        Um cantinho dedicado à criatividade dos membros
        da comunidade Verade PT!
    </p>

    <div class="fanarts-carrossel">

        <div class="fanart-slide">
            <img id="fanartImagem" src="fanarts/fanart1.png"
                 alt="Fanart de Mundo Torajo">

            <h3 id="fanartArtista">Nome do artista</h3>

            <p id="fanartPersonagem">Personagem: Torajo</p>
        </div>

        <div class="fanart-controles">

            <button onclick="anteriorFanart()">❮</button>

            <span id="fanartContador">1 / 3</span>

            <button onclick="proximaFanart()">❯</button>

        </div>

        <button id="pausarFanarts" onclick="pausarFanarts()">
            ⏸️ Pausar
        </button>

    </div>

</section>
